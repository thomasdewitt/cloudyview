<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soar — fly through cloud model output</title>
<meta name="description" content="Fly through a three-dimensional cloud field
  in your browser: volumetric ray marching with multiple scattering, on real
  large-eddy-simulation output or your own netCDF file.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400;500&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="viewer.css">
<link rel="canonical" href="https://thomasddewitt.com/thought-cloud/soar/">
</head>
<body>

<main id="landing">

  <div id="reel">
    <img id="reel-a" alt="">
    <img id="reel-b" alt="">
  </div>

  <div class="frame">

    <header class="strip" id="site-header">
      <nav class="site-nav">
        <a href="../../index.html">Thomas DeWitt</a>
        <span class="sep">/</span>
        <a href="../">Thought Cloud</a>
        <span class="sep">/</span>
        <span class="here">Soar</span>
      </nav>
      <div class="colophon">cloudyview · webgpu</div>
    </header>

    <div class="center">
      <h1>SOAR</h1>
      <p class="tag">Fly through cloud model output</p>

      <button class="own" id="choice-open">Render your own 3D cloud volume</button>
      <p class="own-note">netCDF — or drop one anywhere on this page</p>
      <input type="file" id="file-input" accept=".nc,.nc4,.cdf,.h5,.hdf5">
    </div>

    <div class="base">
      <!-- The rail is built from web/demos/index.json, which is grouped: each
           group brings its own .rail-head. Only the placeholder is markup. -->
      <div class="rail-groups" id="rail">
        <p class="rail-loading">Loading the demo list…</p>
      </div>

      <div class="readout">
        <div id="capability">Checking what this browser can do…</div>
        <div class="keys">
          <kbd>W A S D</kbd> fly &nbsp; <kbd>space</kbd> / <kbd>shift</kbd> climb &nbsp;
          <kbd>scroll</kbd> speed &nbsp; <kbd>esc</kbd> menu
        </div>
      </div>
    </div>

  </div>
</main>

<div id="viewer" hidden>
  <canvas id="view"></canvas>
  <div id="ui"></div>
</div>

<div id="loading" hidden>
  <div class="box">
    <div class="stage" id="loading-stage">Starting…</div>
    <div class="bar"><span id="loading-bar"></span></div>
    <div class="failure" id="loading-failure">
      <h2 id="failure-title"></h2>
      <p id="failure-body"></p>
      <p class="advice" id="failure-advice"></p>
      <button id="failure-back">Back</button>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
