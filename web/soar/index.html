<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soar — fly through cloud model output</title>
<meta name="description" content="Fly through a three-dimensional cloud field
  in your browser: volumetric ray marching with multiple scattering, on real
  large-eddy-simulation output or your own netCDF file.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Barlow Condensed is gone: the wordmark and the case names are set in the
     mono face now, because the viewer has no display face and its titles are
     mono. One less font request, and one less typeface between the landing
     page and the thing it opens into. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="viewer.css">
<link rel="canonical" href="https://thomasddewitt.com/soar/">
</head>
<body>

<main id="landing">

  <div id="reel">
    <img id="reel-a" alt="">
    <img id="reel-b" alt="">
  </div>

  <div class="frame">

    <header class="strip" id="site-header">
      <nav class="site-nav">
        <a href="/">Thomas DeWitt</a>
        <span class="sep">/</span>
        <a href="/thought-cloud/">Thought Cloud</a>
        <span class="sep">/</span>
        <span class="here">Soar</span>
      </nav>
    </header>

    <!-- The cases, down the left. Built from demos/index.json, which is
         grouped: each group brings its own .rail-head. Only the placeholder
         is markup. Hovering one drops the rest of the page to near-nothing
         so its still is most of what is on screen. -->
    <div class="cases" id="rail">
      <p class="rail-loading">Loading the demo list…</p>
    </div>

    <div class="hero">
      <h1>SOAR</h1>
      <p class="tag">Fly through cloud model output</p>
      <!-- One column of identical controls, widest to narrowest audience: the
           two prepared demos, then your own file. All three are .own — there
           is one primary-control treatment on this page and these are three
           instances of it, not a new kind of button next to the old one.
           `hidden` on the pair until main.js knows the mode, so the stack does
           not reflow under the reader on first paint. -->
      <div class="choices">
        <button class="own" type="button" id="fly-less" hidden>
          <!-- Same inner structure as the button below even though this one
               has nothing to caution about, so an error state has somewhere
               to be said rather than having to replace the label. -->
          <span class="own-in">
            <span class="label">Fly less detailed demo</span>
            <span class="warn" id="fly-less-warn"></span>
          </span>
        </button>
        <button class="own" type="button" id="fly-more" hidden>
          <!-- Column inside the button so the caution sits under the label
               rather than beside it, between the two arrow flex items. -->
          <span class="own-in">
            <span class="label">Fly more detailed demo</span>
            <!-- Always open. This is the one caution on the page that is not
                 a disclosure: there is no list to keep tidy here, and it is
                 the difference between a flight and a stalled tab. -->
            <span class="warn" id="fly-more-warn"></span>
          </span>
        </button>
        <button class="own" id="choice-open">Render your own 3D cloud volume</button>
        <input type="file" id="file-input" accept=".nc,.nc4,.cdf,.h5,.hdf5">
      </div>

      <!-- Which page you get. `basic` is the default and hides the rail and
           the file picker, leaving the pair above; `research` is everything.
           Cyberpunk is a real position rather than a promise elsewhere on the
           page, greyed until the night-city branch lands — see MODES in
           main.js, where enabling it is one `ready: true`. -->
      <div class="modes" id="mode-toggle" role="radiogroup" aria-label="Mode"></div>
    </div>

    <div class="readout">
      <div id="capability">Checking what this browser can do…</div>
      <div class="keys">
        <kbd>W A S D</kbd> fly &nbsp; <kbd>space</kbd> / <kbd>shift</kbd> climb<br>
        <kbd>scroll</kbd> speed &nbsp; <kbd>esc</kbd> menu
      </div>
    </div>

  </div>
</main>

<div id="viewer" hidden>
  <canvas id="view"></canvas>
  <div id="ui"></div>
</div>

<div id="loading" hidden>
  <div class="box">
    <div class="stage" id="loading-stage">Starting…</div>
    <div class="bar"><span id="loading-bar"></span></div>
    <div class="failure" id="loading-failure">
      <h2 id="failure-title"></h2>
      <p id="failure-body"></p>
      <p class="advice" id="failure-advice"></p>
      <button id="failure-back">Back</button>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
