<title>cloudyview — fly a real cloud field</title>
<!--
  The viewer moved to soar/.

  What used to live here was the first browser port: one field, one shader,
  a payload described by meta.fif and meta.uniform_template. The demo export
  stopped emitting those keys when the scene gained an ocean, a nest and a
  minimap, so this page has been throwing on meta.fif.mips rather than
  rendering anything. soar/ is the viewer that works; this is a signpost to
  it, so an old bookmark lands somewhere real.

  soar.js and raymarch.wgsl beside this file are what that first port was.
  Nothing references them now.
-->
<meta http-equiv="refresh" content="0; url=soar/">
<link rel="canonical" href="soar/">
<style>
  html, body {
    margin: 0; height: 100%; background: #06080c;
    font-family: system-ui, -apple-system, sans-serif; color: #cfd8e3;
  }
  main { display: grid; place-items: center; height: 100%; }
  p { font-size: 15px; letter-spacing: 0.02em; color: #8fa0b5; }
  a { color: #cfd8e3; }
</style>
</head>
<body>
<main>
  <p>cloudyview has moved to <a href="soar/">soar/</a>.</p>
</main>
<script>location.replace("soar/");</script>
</body>
</html>
