<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soar — 06 Menu box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400;500&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Eight looks for the pause menu's BOX, over real sky. Content and layout are
   the redesigned two-column menu and are identical in every variant — the
   only thing that changes is the container's skin, so the comparison is
   about the box and nothing else.

   The base rules below are viewer.css as it stands; each variant is an
   override block further down. */

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: #05070a;
  --panel-bg: rgba(12, 16, 22, 0.88);
  --panel-line: rgba(150, 172, 200, 0.16);
  --panel-line-lit: rgba(170, 195, 225, 0.42);
  --ink: #d3dcea;
  --ink-bright: #f0f5fb;
  --ink-dim: #8a99ad;
  --hot: #e8834a;
  --ui-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --ui-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --radius: 12px;
  font-family: var(--ui-font);
  color: var(--ink);
}

#sky { position: fixed; inset: 0; }
#sky img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.4s ease;
}
#sky img.on { opacity: 1; }

/* --- the panel --- */

.panel {
  position: absolute;
  background: var(--panel-bg);
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  padding: 14px 16px;
  backdrop-filter: blur(10px);
  font-size: 13px;
  line-height: 1.55;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
}
.panel h3 {
  margin: 0 0 10px;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--ink-dim);
}

#menu {
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(46rem, calc(100vw - 3rem));
  max-height: calc(100vh - 8rem);
  overflow-y: auto;
  padding: 20px 22px;
}
.menu-title { font-size: 17px; color: var(--ink-bright); margin: 0 0 2px; }

.menu-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; margin-bottom: 14px;
}
.menu-head .menu-title { margin: 0; }

button.resume {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--ui-font);
  font-size: 13px;
  color: var(--ink-bright);
  background: rgba(232, 131, 74, 0.14);
  border: 1px solid var(--hot);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
button.resume kbd {
  font-family: var(--ui-mono);
  font-size: 10.5px;
  color: var(--ink-dim);
  border: 1px solid var(--panel-line);
  border-radius: 4px;
  padding: 0 4px;
}

.menu-cols {
  display: grid; grid-template-columns: 1fr 1fr;
  column-gap: 22px; align-items: start;
}
.menu-cols .col > h3:first-child { margin-top: 0; }

.item {
  display: block; width: 100%;
  text-align: left;
  font-family: var(--ui-font);
  font-size: 13.5px;
  color: var(--ink);
  background: none;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 8px 10px;
  cursor: pointer;
}
.item:hover { background: rgba(150, 175, 210, 0.10); border-color: var(--panel-line); }
.item .note { display: block; color: var(--ink-dim); font-size: 11.5px; margin-top: 2px; }

.row { display: flex; align-items: center; gap: 12px; padding: 5px 0; }
.row > label { flex: 0 0 10.5rem; color: var(--ink-dim); font-size: 12.5px; }
.row > .value {
  flex: 0 0 4.25rem; text-align: right;
  font-family: var(--ui-mono); font-size: 12px; color: var(--ink-bright);
}
.row input[type="range"] { flex: 1 1 auto; min-width: 0; accent-color: var(--hot); cursor: pointer; }
.row.tight { display: block; padding: 5px 10px; }
.row.tight > label { display: block; flex: none; margin-bottom: 2px; }
.row.tight > .value { float: right; flex: none; }
.row.tight input[type="range"] { width: 100%; }

.divider { height: 1px; background: var(--panel-line); margin: 14px 0; }

.menu-foot { display: flex; align-items: center; gap: 16px; }
.menu-foot .item { width: auto; flex: none; }

/* ------------------------------------------------------------------ *
 *  1  CURRENT — the dark grey box, for reference                      *
 * ------------------------------------------------------------------ */
/* (the base rules above ARE the current look; no overrides) */

/* ------------------------------------------------------------------ *
 *  THE FROST FAMILY                                                   *
 *                                                                     *
 *  The first frost was unreadable and it is worth being precise about *
 *  why. backdrop-filter blurs what is behind the panel; it does not   *
 *  darken it. So the type sits on the MEAN of whatever is back there, *
 *  and over a sunlit cloud top that mean is very nearly white: the    *
 *  note text measured 1.10:1 against its own panel, where 4.5:1 is    *
 *  the readable floor. Light glass cannot carry light type. Three     *
 *  ways out, and each keeps the glass:                                *
 *    2  darken the fill until light type clears the floor             *
 *    3  keep the glass light and make the type dark                   *
 *    4  keep the film thin and give the type its own shadow           *
 * ------------------------------------------------------------------ */

/*  2  FROST DARK — cool smoked glass. Still blurs and saturates what
 *     is behind it, but carries enough of its own darkness to hold
 *     light type. Bright sky: note 4.65:1, label 6.81:1.  */
body.v-frost-dark {
  --panel-bg: rgba(14, 20, 30, 0.72);
  --panel-line: rgba(255, 255, 255, 0.20);
  --ink: #eaf1fa;
  --ink-bright: #f0f6fd;
  --ink-dim: rgba(226, 236, 248, 0.80);
  --radius: 18px;
}
body.v-frost-dark #menu {
  backdrop-filter: blur(26px) saturate(1.3);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42),
              inset 0 1px 0 rgba(255, 255, 255, 0.24);
  padding: 24px 26px;
}
body.v-frost-dark .item:hover { background: rgba(255, 255, 255, 0.12); }
body.v-frost-dark .divider { background: rgba(255, 255, 255, 0.16); }

/*  3  FROST LIGHT — the same glass, inverted: pale and cool, with dark
 *     type on it. The only skin that reads well at BOTH ends —
 *     bright sky note 8.89:1, night ocean 5.69:1 — because a light
 *     panel over a dark sky still lands mid-grey, and dark ink holds
 *     against both. Cold vellum rather than warm.  */
body.v-frost-light {
  --panel-bg: rgba(228, 237, 248, 0.80);
  --panel-line: rgba(255, 255, 255, 0.55);
  --ink: #1b2027;
  --ink-bright: #10141b;
  --ink-dim: #3a424e;
  --hot: #c25a1c;
  --radius: 18px;
}
body.v-frost-light #menu {
  backdrop-filter: blur(26px) saturate(1.2);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38),
              inset 0 1px 0 rgba(255, 255, 255, 0.7);
  padding: 24px 26px;
}
body.v-frost-light .item:hover { background: rgba(20, 30, 45, 0.08); }
body.v-frost-light .divider { background: rgba(20, 30, 45, 0.16); }
body.v-frost-light button.resume { background: rgba(194, 90, 28, 0.14); }

/*  4  FROST THIN — the original film, near-white type, and the
 *     landing page's text shadow doing the work. Honest warning: a
 *     shadow buys apparent contrast, not measured contrast — over a
 *     sunlit top this is still 1.06:1 and the notes will fade. Kept
 *     because it is the closest to the look, and because over ocean
 *     and storm (10.77:1) it is the best-looking of the three.  */
body.v-frost-thin {
  --panel-bg: rgba(214, 230, 248, 0.10);
  --panel-line: rgba(255, 255, 255, 0.22);
  --ink: #ffffff;
  --ink-bright: #ffffff;
  --ink-dim: rgba(240, 245, 252, 0.92);
  --radius: 18px;
}
body.v-frost-thin #menu {
  backdrop-filter: blur(26px) saturate(1.25);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42),
              inset 0 1px 0 rgba(255, 255, 255, 0.28);
  padding: 24px 26px;
  text-shadow: 0 1px 3px rgba(3, 8, 14, 0.85), 0 0 14px rgba(3, 8, 14, 0.55);
}
body.v-frost-thin .item:hover { background: rgba(255, 255, 255, 0.14); }
body.v-frost-thin .divider { background: rgba(255, 255, 255, 0.20); }

/* ------------------------------------------------------------------ *
 *  3  PLATE — an instrument face. Near-black, opaque, square, hard    *
 *     hairline, mono headings, one amber rule under the title.        *
 * ------------------------------------------------------------------ */
body.v-plate {
  --panel-bg: rgba(6, 9, 13, 0.94);
  --panel-line: rgba(150, 172, 200, 0.22);
  --radius: 2px;
}
body.v-plate #menu {
  backdrop-filter: none;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
  padding: 18px 20px;
}
body.v-plate .panel h3,
body.v-plate .menu-title { font-family: var(--ui-mono); }
body.v-plate .menu-title { font-size: 15px; letter-spacing: 0.02em; }
body.v-plate .menu-head {
  border-bottom: 1px solid var(--hot);
  padding-bottom: 10px;
}
body.v-plate .item { border-radius: 0; }
body.v-plate button.resume { border-radius: 0; }

/* ------------------------------------------------------------------ *
 *  4  VELLUM — the warm paper of the rest of the site, brought into   *
 *     the viewer. Dark ink on light, so it never fights the sky.      *
 * ------------------------------------------------------------------ */
body.v-vellum {
  --panel-bg: rgba(244, 238, 228, 0.94);
  --panel-line: rgba(60, 48, 36, 0.18);
  --ink: #23282f;
  --ink-bright: #10131a;
  --ink-dim: #6d6a63;
  --hot: #b8631f;
  --radius: 10px;
}
body.v-vellum #menu {
  backdrop-filter: blur(6px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.42);
}
body.v-vellum .item:hover { background: rgba(60, 48, 36, 0.08); }
body.v-vellum button.resume { background: rgba(184, 99, 31, 0.14); }
body.v-vellum .divider { background: rgba(60, 48, 36, 0.16); }

/* ------------------------------------------------------------------ *
 *  5  SCRIM — no box at all. A soft dark wash under the type, and     *
 *     type that carries its own shadow. Nothing between you and it.   *
 * ------------------------------------------------------------------ */
body.v-scrim {
  --ink: #eef3fa;
  --ink-bright: #ffffff;
  --ink-dim: rgba(230, 238, 248, 0.66);
}
body.v-scrim #menu {
  background: radial-gradient(120% 90% at 50% 45%,
              rgba(4, 7, 12, 0.78) 0%, rgba(4, 7, 12, 0.62) 45%,
              rgba(4, 7, 12, 0.0) 78%);
  border: none;
  border-radius: 0;
  box-shadow: none;
  backdrop-filter: blur(3px);
  padding: 40px 56px;
  width: min(52rem, calc(100vw - 3rem));
  text-shadow: 0 1px 3px rgba(3, 8, 14, 0.85), 0 0 14px rgba(3, 8, 14, 0.5);
}
body.v-scrim .divider { background: rgba(234, 240, 246, 0.14); }
body.v-scrim .item:hover { background: rgba(234, 240, 246, 0.10); }

/* ------------------------------------------------------------------ *
 *  6  AEROFOIL — the current box, but lifted: a cool vertical         *
 *     gradient, a lit hairline along the top, deeper blur, more air.  *
 * ------------------------------------------------------------------ */
body.v-aerofoil {
  --panel-line: rgba(160, 186, 216, 0.20);
  --ink: #dae3f0;
  --ink-bright: #f6f9fd;
  --ink-dim: #93a3b8;
  --radius: 16px;
}
body.v-aerofoil #menu {
  background: linear-gradient(180deg,
              rgba(30, 42, 58, 0.86) 0%,
              rgba(11, 16, 24, 0.90) 100%);
  backdrop-filter: blur(18px) saturate(1.1);
  box-shadow: 0 26px 64px rgba(0, 0, 0, 0.5),
              inset 0 1px 0 rgba(190, 214, 240, 0.22);
  padding: 24px 26px;
}
body.v-aerofoil .menu-head::after {
  content: ""; display: block;
}
body.v-aerofoil .item:hover { background: rgba(160, 190, 225, 0.12); }

/* --- the mockup's own chrome (not part of the design) --- */

#bar {
  position: fixed; left: 50%; top: 14px;
  transform: translateX(-50%);
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  font-family: var(--ui-mono); font-size: 11px;
  z-index: 10;
}
#bar button {
  font-family: inherit; font-size: 11px;
  color: rgba(234, 240, 246, 0.75);
  background: rgba(6, 9, 13, 0.72);
  border: 1px solid rgba(234, 240, 246, 0.18);
  border-radius: 6px; padding: 5px 10px; cursor: pointer;
  backdrop-filter: blur(8px);
}
#bar button.on { color: #f2a25c; border-color: #f2a25c; }
#bar .sep { width: 14px; }
#caption {
  position: fixed; left: 50%; bottom: 16px;
  transform: translateX(-50%);
  font-family: var(--ui-mono); font-size: 11.5px;
  color: rgba(234, 240, 246, 0.8);
  background: rgba(6, 9, 13, 0.72);
  border: 1px solid rgba(234, 240, 246, 0.14);
  border-radius: 7px; padding: 6px 12px;
  backdrop-filter: blur(8px);
  max-width: 46rem; text-align: center;
  z-index: 10;
}
</style>
</head>
<body class="v-current">

<div id="sky">
  <img class="on" src="media/cumulus.jpg" alt="">
  <img src="media/anvil.jpg" alt="">
  <img src="media/underside.jpg" alt="">
  <img src="media/sunset.jpg" alt="">
</div>

<div id="bar">
  <button data-v="current" class="on">1 · current</button>
  <button data-v="frost-dark">2 · frost dark</button>
  <button data-v="frost-light">3 · frost light</button>
  <button data-v="frost-thin">4 · frost thin</button>
  <button data-v="plate">5 · plate</button>
  <button data-v="vellum">6 · vellum</button>
  <button data-v="scrim">7 · scrim</button>
  <button data-v="aerofoil">8 · aerofoil</button>
  <span class="sep"></span>
  <button data-sky="0" class="on">bright</button>
  <button data-sky="1">anvil</button>
  <button data-sky="2">dark</button>
  <button data-sky="3">low sun</button>
</div>

<div id="menu" class="panel">
  <div class="menu-head">
    <p class="menu-title">Paused</p>
    <button class="resume"><span>Resume</span><kbd>Esc</kbd></button>
  </div>

  <div class="menu-cols">
    <div class="col">
      <h3>appearance</h3>
      <button class="item"><span>Time of day…</span><span class="note">34° zenith</span></button>
      <button class="item"><span>Quality…</span><span class="note">High — every ray, 1.000x, chosen automatically</span></button>
      <button class="item"><span>Minimap: on</span><span class="note">Keyboard shortcut: M</span></button>
      <button class="item"><span>Bird: on</span><span class="note">Keyboard shortcut: B</span></button>
      <button class="item"><span>Enter fullscreen</span><span class="note">Keyboard shortcut: F</span></button>
    </div>
    <div class="col">
      <h3>session</h3>
      <button class="item"><span>Open a NetCDF file…</span><span class="note">Current: TWP-ICE · 1024 × 1024 × 206 · 100 m</span></button>
      <button class="item"><span>Capture…</span></button>
      <button class="item"><span>Render this view in a terminal…</span></button>
      <button class="item"><span>Controls</span></button>
      <button class="item"><span>Periodic domain: on</span><span class="note">wrap the field laterally</span></button>
      <div class="row tight">
        <label>Field of view</label>
        <span class="value">64°</span>
        <input type="range" min="20" max="110" step="1" value="64">
      </div>
    </div>
  </div>

  <div class="divider"></div>
  <div class="menu-foot">
    <button class="item"><span>Back to the start page</span></button>
  </div>
</div>

<div id="caption"></div>

<script>
// Contrast figures are the note text against its own panel, over a sunlit
// cloud top (the worst case) and over a night ocean. 4.5:1 is the floor.
const NOTES = {
  "current":     "1 \u00b7 current \u2014 the dark grey box: flat fill, 10px blur, 12px radius. Bright sky 4.79:1, just over the floor.",
  "frost-dark":  "2 \u00b7 frost dark \u2014 smoked glass: the same 26px blur and saturation, dark enough to hold light type. Bright 4.65:1, dark 10.01:1.",
  "frost-light": "3 \u00b7 frost light \u2014 the glass inverted: pale panel, dark ink. The only skin comfortable at both ends \u2014 bright 8.89:1, dark 5.69:1.",
  "frost-thin":  "4 \u00b7 frost thin \u2014 the original film, with the landing page\u2019s text shadow doing the work. Lovely over ocean (10.77:1); still 1.06:1 over a sunlit top, because a shadow buys apparent contrast, not measured contrast.",
  "plate":       "5 \u00b7 plate \u2014 near-opaque near-black, square corners, no blur, mono headings, one amber rule. An instrument face. 6.15:1 bright, 6.84:1 dark.",
  "vellum":      "6 \u00b7 vellum \u2014 the site\u2019s warm paper brought into the viewer. Dark ink on light never competes with the sky for brightness.",
  "scrim":       "7 \u00b7 scrim \u2014 no box: a radial wash and type that carries its own shadow. Most view, least chrome; edges are undefined.",
  "aerofoil":    "8 \u00b7 aerofoil \u2014 the current box lifted: cool vertical gradient, lit hairline, 18px blur, more air. Nearest to today.",
};
const body = document.body;
const caption = document.getElementById("caption");
const skies = [...document.querySelectorAll("#sky img")];

function setVariant(v) {
  body.className = "v-" + v;
  caption.textContent = NOTES[v];
  for (const b of document.querySelectorAll("#bar button[data-v]")) {
    b.classList.toggle("on", b.dataset.v === v);
  }
}
function setSky(i) {
  skies.forEach((img, k) => img.classList.toggle("on", k === Number(i)));
  for (const b of document.querySelectorAll("#bar button[data-sky]")) {
    b.classList.toggle("on", b.dataset.sky === String(i));
  }
}
for (const b of document.querySelectorAll("#bar button[data-v]")) {
  b.addEventListener("click", () => setVariant(b.dataset.v));
}
for (const b of document.querySelectorAll("#bar button[data-sky]")) {
  b.addEventListener("click", () => setSky(b.dataset.sky));
}
// 1-6 pick a look, [ and ] step the sky — so it can be flipped fast.
addEventListener("keydown", (e) => {
  const order = ["current", "frost-dark", "frost-light", "frost-thin",
                   "plate", "vellum", "scrim", "aerofoil"];
  const n = Number(e.key);
  if (n >= 1 && n <= order.length) setVariant(order[n - 1]);
  if (e.key === "[" || e.key === "]") {
    const cur = skies.findIndex((img) => img.classList.contains("on"));
    setSky((cur + (e.key === "]" ? 1 : skies.length - 1)) % skies.length);
  }
});
setVariant("current");
</script>
</body>
</html>
