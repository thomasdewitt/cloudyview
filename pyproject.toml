[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudyview"
version = "0.1.0"
description = "3D cloud field visualization toolkit with radiative transfer"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Thomas D. DeWitt", email = "thomas@example.com"}
]
license = {text = "MIT"}
keywords = ["clouds", "visualization", "radiative-transfer", "atmospheric-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.3",
    "xarray>=0.18",
    "netCDF4>=1.5",
    "pyyaml>=5.4",
    "numba>=0.57",
    "scaleinvariance>=0.10",
]

[project.optional-dependencies]
radiative-transfer = [
    "mitsuba>=3.0.0",
    "drjit>=0.3.0",
]
interactive = [
    # WGSL/wgpu interactive fly-through engine (cloudyview.soar).
    "wgpu>=0.19",
    "glfw>=2.6",
    "imgui-bundle>=1.6",
]
visualization = [
    "scikit-image>=0.19.0",
    "scipy>=1.7.0",
    "pyvista>=0.37.0",
]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "isort>=5.0",
    "flake8>=3.9",
    "imageio>=2.28",
]
all = [
    "mitsuba>=3.0.0",
    "drjit>=0.3.0",
    "scikit-image>=0.19.0",
    "scipy>=1.7.0",
    "pytest>=6.0",
    "black>=21.0",
    "isort>=5.0",
    "flake8>=3.9",
]

[project.scripts]
glimpse = "cloudyview.glimpse:cli"
witness = "cloudyview.witness:cli"
behold = "cloudyview.behold:cli"
soar = "cloudyview.soar.__main__:main"

[project.urls]
Homepage = "https://github.com/thomasdewitt/cloudyview"
Documentation = "https://github.com/thomasdewitt/cloudyview"
Repository = "https://github.com/thomasdewitt/cloudyview.git"
Issues = "https://github.com/thomasdewitt/cloudyview/issues"

[tool.uv.sources]
scaleinvariance = { path = "../scaleinvariance", editable = true }

[tool.setuptools.packages.find]
include = ["cloudyview*"]

[tool.setuptools.package-data]
"cloudyview.soar" = ["*.wgsl"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring CUDA GPU (deselect with '-m \"not gpu\"')",
]
testpaths = ["tests"]
