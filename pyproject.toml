[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudyview"
version = "0.1.0"
description = "3D cloud field visualization toolkit with radiative transfer"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Thomas D. DeWitt", email = "thomas.dewitt@utah.edu"}
]
license = {text = "MIT"}
keywords = ["clouds", "visualization", "radiative-transfer", "atmospheric-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.3",
    "xarray>=0.18",
    "netCDF4>=1.5",
    "pyyaml>=5.4",
    "wgpu>=0.30",
    "scaleinvariance>=0.10",
]

[project.optional-dependencies]
# behold (Mitsuba path tracing) is the only optional feature:
# pip install cloudyview[behold]
behold = [
    "mitsuba>=3.0.0",
    "drjit>=0.3.0",
]
dev = [
    "pytest>=6.0",
    "imageio>=2.28",
    "pillow>=9.0",
]

[project.scripts]
glimpse = "cloudyview.glimpse:cli"
witness = "cloudyview.witness:cli"
behold = "cloudyview.behold:cli"

[project.urls]
Homepage = "https://github.com/thomasdewitt/cloudyview"
Documentation = "https://github.com/thomasdewitt/cloudyview"
Repository = "https://github.com/thomasdewitt/cloudyview.git"
Issues = "https://github.com/thomasdewitt/cloudyview/issues"

[tool.uv.sources]
scaleinvariance = { path = "../scaleinvariance", editable = true }

[tool.setuptools.packages.find]
include = ["cloudyview*"]

[tool.setuptools.package-data]
cloudyview = [
    "Mie_tables/*_normalized.txt",
    "soar/raymarch.wgsl",
    "soar/ocean/*",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring CUDA GPU (deselect with '-m \"not gpu\"')",
]
testpaths = ["tests"]
