name: Release desktop bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
            archive: dist/cloudyview-soar-linux-x86_64.tar.gz
          - os: macos-14
            asset: macos-arm64
            archive: dist/cloudyview-soar-macos-arm64.zip
          - os: windows-latest
            asset: windows-x86_64
            archive: dist/cloudyview-soar-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install build and interactive dependencies
        run: uv sync --no-sources --extra dev --extra interactive

      - name: Run headless-safe tests
        run: uv run --no-sync pytest -m "not gpu"

      - name: Generate platform icons
        run: uv run --no-sync python packaging/make_icons.py

      - name: Build one-directory application
        run: uv run --no-sync pyinstaller --clean --noconfirm packaging/soar.spec

      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -C dist -czf dist/cloudyview-soar-linux-x86_64.tar.gz cloudyview-soar

      - name: Archive macOS app and launch notes
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/cloudyview-soar-macos-arm64
          cp -R "dist/CloudyView Soar.app" dist/cloudyview-soar-macos-arm64/
          cp packaging/README_MAC.txt dist/cloudyview-soar-macos-arm64/
          ditto -c -k --sequesterRsrc --keepParent \
            dist/cloudyview-soar-macos-arm64 \
            dist/cloudyview-soar-macos-arm64.zip

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/cloudyview-soar `
            -DestinationPath dist/cloudyview-soar-windows-x86_64.zip

      - name: Upload archives to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.archive }}
